name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  integrity:
    name: Repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repo verification
        run: bash scripts/verify_repo.sh

  template:
    name: Template integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate _template.docx (zip + word/document.xml)
        run: |
          unzip -t _template.docx
          unzip -p _template.docx word/document.xml > /dev/null
