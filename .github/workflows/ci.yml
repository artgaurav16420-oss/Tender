name: rrcat-tender Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install officecli
        run: npm install -g officecli
        shell: bash

      - name: Install markitdown
        run: pip install markitdown
        shell: bash

      - name: Run unified test suite
        run: python scripts/test_suite.py
        shell: bash

      - name: Run questionnaire unit tests
        run: python scripts/test_questionnaire.py
        shell: bash

      # sync_skill --check requires the separately installed Hermes skill path;
      # run it locally after installation, not on a clean CI runner.
      - name: Validate repository scripts compile
        run: python -m py_compile scripts/*.py
        shell: bash

      - name: Check repository sync script syntax
        run: python -m py_compile scripts/sync_skill.py
        shell: bash
        