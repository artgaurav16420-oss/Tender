name: rrcat-tender Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-checks:
    name: Fast Quality Gates
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install officecli
        run: npm install -g officecli
        shell: bash

      - name: Install markitdown
        run: pip install markitdown
        shell: bash

      - name: Diagnostic - Python version
        run: python --version
        shell: bash

      - name: Diagnostic - officecli version
        run: officecli --version
        shell: bash

      - name: Diagnostic - markitdown version
        run: markitdown --version
        shell: bash

      - name: Run questionnaire unit tests
        run: python scripts/test_questionnaire.py
        shell: bash

      - name: Validate template structure
        run: python scripts/validate_template.py _template.docx
        shell: bash

      - name: Validate repository scripts compile
        run: python -m py_compile scripts/*.py
        shell: bash

      - name: Sync skill dry-run (no writes)
        run: python scripts/sync_skill.py --dry-run
        shell: bash

      - name: Tender learn dry-run (no writes)
        run: python scripts/tender_learn.py --dry-run Examples/Solar_PV_20kWp_Civil.md
        shell: bash

  full-regression:
    name: Full Regression (22 examples)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: fast-checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install officecli
        run: npm install -g officecli
        shell: bash

      - name: Install markitdown
        run: pip install markitdown
        shell: bash

      - name: Run full regression test
        run: python scripts/regression_test.py
        shell: bash

      - name: Upload generated artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-artifacts
          path: |
            **/*.docx
            **/*.failed.docx
          retention-days: 7